  <text x="130" y="272" font-family="'Barlow', Arial, sans-serif" font-size="40" font-weight="600" fill="#ffffff">When to run, how fast, and what to wear. Today.</text>
  <text x="130" y="318" font-family="'Barlow', Arial, sans-serif" font-size="26" fill="#cfe6d8">Weather-adjusted pace, ice and heat warnings, and the best time to run</text>
